
    @if (!customIcon) {
      <mat-icon class=" {{ size }} {{ severity }}">{{ icon }}</mat-icon>
    } @else {
      @if(iconService.iconReady$(icon) | async)
      {
        <mat-icon class=" {{ size }} {{ severity }}" [svgIcon]="icon"></mat-icon>
      }
      @else {
        <div class=" {{ size }} {{ severity }}">{{ icon }}</div>
      }
    }
