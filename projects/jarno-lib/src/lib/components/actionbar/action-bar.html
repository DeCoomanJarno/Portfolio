
    @if (actions && actions.length > 0) {
      <div class="actions" [style.flex-direction]="direction">
        @for (action of actions; track action; let index = $index) {
          @if (index === 0) {
            <button
              mat-flat-button
              class="{{ size }}"
              [color]="color"
              (click)="performAction($event, action.action)"
              type="button"
            >
              {{ action.label }}
            </button>
          }
          @if (index === 1 && moreThanTwoActions()) {
            <button
              mat-stroked-button
              class="{{ size }}"
              [color]="color"
              (click)="performAction($event, action.action)"
              type="button"
            >
              {{ action.label }}
            </button>
          }
          @if ((index === 1 && !moreThanTwoActions()) || index > 1) {
            <button
              mat-button
              class="{{ size }}"
              [color]="color"
              (click)="performAction($event, action.action)"
              type="button"
            >
              {{ action.label }}
            </button>
          }
        }
      </div>
    }
