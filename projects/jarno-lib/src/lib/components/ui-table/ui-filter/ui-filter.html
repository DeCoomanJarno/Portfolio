<mat-card class="search-container" appearance="outlined">
  <div class="filter-container">
    <div class="search-container
      {{ filterExpand ? 'filterExpand' : 'filterNoExpand' }}
      {{ hotpicks ? 'withHotpicks' : '' }}
      {{ preHotpick ? 'withPreHotpick' : '' }}
      {{ control ? 'withSearch' : 'noSearch' }}">
      @if (preHotpick) {
      <div class="preHotpick">
        <ng-content select="[select='pre']"></ng-content>
      </div>
      }

      @if (control) {
        <mat-form-field class="search-field">
          <input autocapitalize="none" type="search" [formControl]="control" matInput [placeholder]="placeholder"
          data-testid="search-input" />
        </mat-form-field>
      }

      @if (hotpicks) {
      <div class="hotpicks">
        <ng-content select="ui-hotpick:not([select='action']):not([select='pre'])" class="hotpick-filter">
        </ng-content>
        <ng-content select="[hotpicks]" class="hotpick-filter">
        </ng-content>
      </div>
      }

      @if (filterExpand) {
      <div class="advancedSearch" #advancedFilterRef>
        <ng-content select="[select='advanced']"></ng-content>
      </div>
      }
    </div>
  </div>
</mat-card>

<mat-card appearance="outlined">
  <div class="actions">
    <ng-content select="[select='action']"></ng-content>
  </div>
</mat-card>
