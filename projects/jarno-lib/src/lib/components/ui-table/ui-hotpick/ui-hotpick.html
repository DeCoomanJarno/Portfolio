
    <div class="hotpick" [class.active]="active">
      @if (hasLabel) {
        <div class="label-container">
          <div class="label">{{ label }}</div>
          @if (hasIcon && !svgIcon) {
            <ui-icon size="x-small" icon="{{ icon }}"></ui-icon>
          }
          @if (hasIcon && svgIcon) {
            <ui-icon size="x-small" customIcon="true" [icon]="icon"></ui-icon>
          }
        </div>
      }
      <div class="value-container">
        <ng-content></ng-content>
      </div>
    </div>
