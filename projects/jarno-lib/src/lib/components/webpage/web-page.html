<div class="webpage">
  <!-- main content -->
  <div class="webpage__content">
    <ng-content></ng-content>
  </div>

  <!-- side panel container -->
  @if(panel.state$ | async; as state)
  {
  <ui-side-panel [open]="state.id !== null" position="right" (closed)="panel.close()">
    @if (panel.current.id; as panelId) {
      @if (panel.getComponentType(panelId); as componentType) {
        <ng-container *ngComponentOutlet="componentType; injector: injector"></ng-container>
      }
    }
  </ui-side-panel>
  }
</div>
