    <div
      class="card-container padding-{{ padding }} background-{{
        backgroundColor
      }}"
      [class.clickable]="clickable"
      [class.rounded]="rounded"
      [class.border]="border"
      [class.selected]="selected"
      [class.headerOnly]="headerOnly"
    >
      <ng-content select="ui-card-header"></ng-content>
      @if (!headerOnly) {
        <div class="card-content" data-testid="content">
          <ng-content></ng-content>
        </div>
      }
      <ng-content select="ui-card-footer"></ng-content>
    </div>
