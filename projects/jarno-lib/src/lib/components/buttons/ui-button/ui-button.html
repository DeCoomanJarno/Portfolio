<div [matTooltip]="tooltip" [matTooltipDisabled]="tooltipDisabled" class="ui-button-wrapper">
  <button class="ui-button"
          mat-button
          [disabled]="disabled"
          [color]="color"
          [ngClass]="size"
          (click)="!disabled && clicked.emit($event)">
    <ng-content></ng-content>
  </button>
</div>
