<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    // Capture the current path the user tried to visit
    var path = window.location.pathname;

    // Redirect the user to the home page (index.html)
    // Let Angular handle routing once the home page is loaded
    window.location.replace('/');

    // Wait until the home page is loaded, then use Angular's router to navigate to the original route
    window.addEventListener('load', function() {
      window.location.replace(path);
    });
  </script>
</head>
<body></body>
</html>
