<div class="glass-panel architecture-map-box">
      <h3>{{ 'ai.architecture.title' | translate }}</h3>
      <div class="canvas-wrapper">
        <svg [attr.viewBox]="'0 0 ' + viewWidth + ' ' + viewHeight" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
          <defs>
            <marker id="edge-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" class="arrow-head" />
            </marker>
          </defs>

          <g class="edges">
            <ng-container *ngFor="let edge of edges">
              <path [attr.d]="edgePath(edge)" fill="none" class="edge-base" />
              <path [attr.d]="edgePath(edge)" fill="none" class="edge-flow" marker-end="url(#edge-arrow)" />
            </ng-container>
          </g>

          <g class="nodes">
            <g *ngFor="let node of positioned" [attr.transform]="'translate(' + node.x + ', ' + node.y + ')'">
              <rect x="-65" y="-28" width="130" height="56" rx="12" [attr.class]="'node-plate ' + node.type" />
              <circle cx="-40" cy="0" r="13" [attr.class]="'indicator-icon ' + node.type" />
              <text x="-40" y="4" class="node-symbol" text-anchor="middle">{{ getSymbol(node.type) }}</text>
              <text x="-18" y="4" class="node-title" text-anchor="start">{{ node.label }}</text>
            </g>
          </g>
        </svg>
      </div>
    </div>
