<form class="contact-form-content" (submit)="onSubmit($event)">
  <div class="form-group">
      <input type="text" name="name" placeholder="{{ 'contact.name' | translate }}" required />
    </div>
    <div class="form-group">
      <input type="email" name="email" placeholder="{{ 'contact.email' | translate }}" required />
  </div>

  <div class="form-group">
    <textarea
      name="message"
      placeholder="{{ 'contact.message' | translate }}"
      rows="5"
      required
    ></textarea>
  </div>

  <button
    type="submit"
    class="contact-send-button"
    [disabled]="isSubmitting"
  >
    {{ isSubmitting ? ('contact.sending' | translate) : ('contact.send' | translate) }}
  </button>
@if(statusMessage)
{
  <div
    class="form-status"
    [ngClass]="{ success: isSuccess, error: !isSuccess }"
  >
    {{ statusMessage }}
  </div>
    
}
</form>
