<header class="header">
  <nav class="navbar navbar-expand-custom fixed-top navbar-light">
    <section>
    <div class="logo-container">
      <a routerLink="/Home">
        <ui-logo/>
      </a>
    </div>

    <ui-button class="navbar-toggler" type="button" size="Large" icon="{{ isMenuOpen ? 'close' : 'menu' }}" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
      aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
    </ui-button>
    <div class="collapse navbar-collapse AlignRight" id="navbarSupportedContent">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/Home" routerLinkActive="active">
            {{ 'titles.home' | translate }}
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/About" routerLinkActive="active">
            {{ 'titles.about' | translate }}
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/Projects" routerLinkActive="active" >
            {{ 'titles.projects' | translate }}
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/Resume" routerLinkActive="active">
            {{ 'titles.resume' | translate }}
          </a>
        </li>
      </ul>

      <div class="ml-auto language-selector d-flex align-items-center">
<div class="dropdown language-dropdown">
  <button
    class="btn btn-outline-secondary dropdown-toggle"
    type="button"
    id="languageDropdown"
    data-bs-toggle="dropdown"
    aria-expanded="false"
  >
    {{ 'languages.' + currentLang | translate }}
  </button>
  <ul class="dropdown-menu" aria-labelledby="languageDropdown">
    @for (language of languages; track $index) {
      <li>
        <a class="dropdown-item" href="#" (click)="setLanguage(language)">
          {{ 'languages.' + language | translate }}
        </a>
      </li>
    }
  </ul>
</div>


        <!-- Theme toggle button -->
        <label class="theme-toggle">
          <input type="checkbox" id="theme-checkbox" [checked]="isDarkMode" (change)="toggleTheme()">
          <div class="toggle-track">
            <div class="toggle-thumb">
              <span class="bi bi-sun-fill"></span>
              <span class="bi bi-moon-fill"></span>
            </div>
          </div>
        </label>

      </div>
    </div>
    </section>
  </nav>
</header>
