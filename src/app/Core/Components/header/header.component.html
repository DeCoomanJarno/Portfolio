<header class="header">
  <nav class="navbar navbar-expand-custom fixed-top navbar-light bg-light">
    <div class="logo-container">
      <a routerLink="/Home">
        <img class="nav-item" src="{{commonDataService.CommonData?.Logo}}" alt="Logo" />
      </a>
    </div>
    <div class="AlignRight">
      <button class="navbar-toggler" type="button" (click)="closeNavbar()">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>

    <!-- Navbar collapse section -->
    <div class="collapse navbar-collapse AlignRight" id="navbarSupportedContent">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item"><a class="nav-link" routerLink="/Home" routerLinkActive="active" (click)="closeNavbar()">{{languageService.getTranslation('Home')}}</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/Projects" routerLinkActive="active" (click)="closeNavbar()">{{languageService.getTranslation('Projects')}}</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/Resume" routerLinkActive="active" (click)="closeNavbar()">{{languageService.getTranslation('Resume')}}</a></li>
      </ul>
      <!-- Language Selector, aligned to the right -->
      <div class="ml-auto language-selector d-flex align-items-center">
        <select id="language" (change)="changeLanguage($event)" class="form-control">
          <option value="EN">{{ languageService.getTranslation('languageSelector')['EN'] }}</option>
         <!-- <option value="NL">{{ languageService.getTranslation('languageSelector')['NL'] }}</option>-->
        </select>
      </div>
    </div>
  </nav>
</header>
