<div class="timeline-item" #item>
  <div class="timeline-dot"></div>
  <div class="timeline-line"></div>
  <div class="timeline-content surface">
    <div class="timeline-header">
      <div class="timeline-header-main">
        <h5>{{ title | translate }}</h5>
        <span class="role-badge">{{ badge | translate }}</span>
      </div>
      <div class="timeline-sub">
        <div class="dates">{{ dates | translate }}</div>
        <div class="location">{{ location | translate }}</div>
      </div>
    </div>
    <p>{{ description | translate }}</p>
  </div>
</div>
