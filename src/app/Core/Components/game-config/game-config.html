<div class="config-panel">

  @for (field of config | keyvalue; track field.key) {

    @let key = field.key;
    @let c = field.value;

    <div class="config-control">

      <label>{{ key }}</label>

      @if (c.type === 'slider') {
        <input type="range"
               [min]="c.min"
               [max]="c.max"
               [step]="c.step"
               [value]="c.value"
               (input)="update(key, $any($event.target).value)" />

        <span>{{ c.value }}</span>
      }

      @if (c.type === 'toggle') {
        <input type="checkbox"
               [checked]="c.value"
               (change)="update(key, $any($event.target).checked)" />
      }

      @if (c.type === 'select') {
        <select
          [value]="c.value"
          (change)="update(key, $any($event.target).value)">

          @for (o of c.options; track o.value) {
            <option [value]="o.value">{{ o.label }}</option>
          }

        </select>
      }

    </div>
  }

</div>
