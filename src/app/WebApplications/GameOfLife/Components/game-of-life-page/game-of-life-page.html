<h1 class="text-center">Game Of Life</h1>

<div class="row mt-3">

  <!-- CANVAS (FAST RENDERING) -->
  <div class="col-md-9 d-flex justify-content-center align-items-center">
    <canvas
      #canvas
        (click)="onCanvasClick($event)">
    </canvas>
  </div>

  <!-- CONTROLS -->
  <div class="col-md-3 d-flex align-items-center">
    <div class="card config">
      <div class="card-body">
<app-game-config
  [config]="cfg"
  (configChange)="onConfigChanged($event)">
</app-game-config>


        <app-loading [isLoading]="isLoading"></app-loading>
      </div>

      <div class="card-body">
        <button class="btn btn-primary btn-block" (click)="Activate()">Start</button>
        <button class="btn btn-danger btn-block" (click)="Deactivate()">Stop</button>
        <button class="btn btn-warning btn-block" (click)="Clear()">Reset</button>
        <button class="btn btn-info btn-block" (click)="Randomize()">Randomize</button>
      </div>

    </div>
  </div>

</div>
