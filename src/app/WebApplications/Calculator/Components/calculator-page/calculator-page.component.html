<div class="calculator-page">
  <div class="sidebar">
    <button (click)="switchCalculator(ECalculatorType.Simple)" class="sidebar-button">Simple</button>
    <button (click)="switchCalculator(ECalculatorType.Science)" class="sidebar-button">Science</button>
    <button (click)="switchCalculator(ECalculatorType.Programming)" class="sidebar-button">Programming</button>
  </div>

  <div class="calculator-container">
    <ng-container>
      @switch (selectedCalculator) {
      @case (ECalculatorType.Simple) {
      <app-simple-calculator></app-simple-calculator>}
      @case (ECalculatorType.Science) {
      <app-science-calculator></app-science-calculator>}
      @case (ECalculatorType.Programming) {
      <app-programming-calculator></app-programming-calculator>}
      }
    </ng-container>
  </div>
</div>
