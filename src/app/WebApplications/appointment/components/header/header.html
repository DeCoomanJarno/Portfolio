<div class="header-right">
  @if((auth.getCurrentUser()); as user)
  {
    <ng-container>
      <button mat-button [matMenuTriggerFor]="menu">{{ user.username }}</button>
      <mat-menu #menu="matMenu">
        <button mat-menu-item (click)="logout()">{{ 'Appointment.Login.Logout' | translate }}</button>
      </mat-menu>
    </ng-container>
  }
@else{
  <div>
    <a mat-button color="accent" routerLink="/Appointments/login">{{ 'Appointment.Login.Login' | translate }}</a>
  </div>
}
</div>
