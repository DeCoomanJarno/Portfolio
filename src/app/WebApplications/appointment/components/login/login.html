<div class="login-container container mt-5">
<mat-card class="p-4 shadow-sm m-5 card">
  <h2 class="text-center mb-3">{{ 'Appointment.Login.Title' | translate }}</h2>

  <form [formGroup]="loginForm" (ngSubmit)="submit()">
    <mat-form-field class="w-100 mb-3">
      <mat-label>{{ 'Appointment.Login.Email' | translate }}</mat-label>
      <input matInput formControlName="email">
    </mat-form-field>

    <mat-form-field class="w-100 mb-3">
      <mat-label>{{ 'Appointment.Login.Password' | translate }}</mat-label>
      <input matInput type="password" formControlName="password">
    </mat-form-field>


  @if(showRegistration)
  {
  <form [formGroup]="loginForm" (ngSubmit)="register()">
    <mat-form-field class="w-100 mb-3">
      <mat-label>{{ 'Appointment.BookAppointment.Name' | translate }}</mat-label>
      <input matInput formControlName="name">
    </mat-form-field>

    <mat-form-field class="w-100 mb-3">
      <mat-label>{{ 'Appointment.BookAppointment.Fullname' | translate }}</mat-label>
      <input matInput formControlName="fullname">
    </mat-form-field>

    <button mat-raised-button color="primary" class="w-100" type="submit" [disabled]="loginForm.invalid">
      {{ 'Appointment.Login.Register' | translate }}
    </button>
  </form>

  }
  @else {
    <button mat-raised-button color="primary" class="w-100" type="submit" [disabled]="loginForm.invalid">
      {{ 'Appointment.Login.Submit' | translate }}
    </button>
  }
  </form>
</mat-card>
</div>
