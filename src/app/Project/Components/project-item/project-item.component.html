<div class="project-card" [routerLink]="['/projects', project.id]">
  @if(project.images && project.images.length > 0)
  {
    <div class="image-container">
      @if (hasMultipleImages) {
      @for (image of project.images; track $index) {
        <img 
        [src]="image" 
        [alt]="'Project image ' + ($index + 1)" 
        class="project-image fade" 
        [ngStyle]="{'animation-delay': getAnimationDelay($index), 'animation-duration': getAnimationDuration()}" />
      }
    }
    @else {
      <img 
      [src]="project.images[0]" 
      [alt]="'Project image'" 
      class="project-image"/>

    }
    </div>
  }
  <div class="project-info">
    <div class="project-header">
      <h2>{{ project.title }}</h2>
      <a [href]="this.project.githubLink" (click)="$event.stopPropagation()">
        <img [src]="'Github' | icon" alt="GitHub" class="github-icon">
      </a>
    </div>
    <p>{{ project.description }}</p>
  <div class="tech-list">
    @for (item of this.project.technologies; track $index) {
      <div class="tech-item">
        <img [src]="item | icon" [alt]="item" [title]="item">
      </div>
    }
  </div>
</div>
</div>
