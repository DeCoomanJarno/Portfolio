<div
  class="xp-os"
  [class.xp-os--capture]="captureMode"
  (pointerdown)="$event.stopPropagation()"
  (pointerup)="$event.stopPropagation()"
  (pointermove)="$event.stopPropagation()">
  <div class="xp-os__desktop">
    @for (app of apps; track $index) {
    <button class="xp-os__icon" (click)="onDesktopAppClick(app)" [attr.data-xp-hit]="'app-' + app.id">
      <span class="xp-os__icon-badge">{{ app.iconLabel.charAt(0) }}</span>
      <span class="xp-os__icon-label">{{ app.iconLabel }}</span>
    </button>
    }

  </div>

  <div class="xp-os__window" *ngIf="openAppMeta as app">
    <div class="xp-os__titlebar">
      <span>{{ app.title }}</span>
      <button type="button" class="xp-os__close" (click)="closeApp.emit()" data-xp-hit="app-close">X</button>
    </div>

    <div class="xp-os__body">
      <app-xp-app-services *ngIf="app.id === 'services'" [expertise]="expertise"></app-xp-app-services>
      <app-xp-app-process *ngIf="app.id === 'process'"></app-xp-app-process>
      <app-xp-app-contact
        *ngIf="app.id === 'contact'"
        [note]="contactNote"
        [email]="contactEmail"></app-xp-app-contact>
    </div>
  </div>

  <div class="xp-os__taskbar">
    <div class="xp-os__taskbar-left">
      <button class="xp-os__start" type="button" data-xp-hit="start">
        <span class="xp-os__win-icon" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </span>
        <span>Start</span>
      </button>

      <button
        *ngIf="openAppMeta as app"
        class="xp-os__task-item"
        type="button"
        [attr.data-xp-hit]="'app-' + app.id"
        (click)="onDesktopAppClick(app)">
        {{ app.title }}
      </button>
    </div>

    <div class="xp-os__clock-wrap">
      <span class="xp-os__clock">{{ clockLabel }}</span>
    </div>
  </div>
</div>
